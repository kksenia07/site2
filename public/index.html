    <style>
        /* Стили для формы обратной связи */
.form-group {
    margin-bottom: 20px;
    text-align: left;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: black;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #000;
    outline: none;
}

.submit-btn {
    background: black;
    color: white;
    padding: 12px 30px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
    transition:  0.3s ease;
}

.submit-btn:hover {
    background: #333;
}

.error {
    color: red;
    margin-top: 10px;
    font-size: 14px;
}

.success {
    color: green;
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
}

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: rgb(225, 217, 217);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .card {
            background: rgb(255, 255, 255);
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin-bottom: 30px;
        }
        
        .photo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 4px solid black;
            margin-bottom: 20px;
        }
        
        h1 {
            color: black;
            margin-bottom: 10px;
        }
        
        .vsu-badge {
            background: rgb(255, 255, 255);
            color: rgb(247, 4, 4);
            padding: 8px 15px;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .specialty {
            color: black;
            margin-bottom: 25px;
            font-size: 16px;
        }
        
        .contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: #f8f9fa;
            text-decoration: none;
            color: #f80606;
            transition: all 0.3s ease;
        }
        
        .contact:hover {
            background: #ffffff;
            color: rgb(0, 0, 0);
            transform: translateY(-2px);
        }
        
        .vsu-link {
            background:  rgb(255, 255, 255);
            color: rgb(0, 0, 0);
        }
        
        .vsu-link:hover {
            background:  rgb(0, 0, 0);
        }

<!-- Форма обратной связи -->
<section id="feedback" style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <h2>Обратная связь</h2>
    <form id="feedbackForm">
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="message">Сообщение:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        
        <button type="submit" class="submit-btn">Отправить сообщение</button>
    </form>
    
    <div id="responseMessage" style="display: none; margin-top: 15px; padding: 10px; border-radius: 4px;"></div>
</section>
